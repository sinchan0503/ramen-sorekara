name: 予約投稿 - 毎朝自動ビルド

on:
  schedule:
    # 毎日 UTC 0:00 = JST 9:00 に実行
    - cron: '0 0 * * *'
  workflow_dispatch: # 手動実行も可能にしておく

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Cloudflare Pages ビルドをトリガー
        run: |
          curl -s -X POST "${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}"
          echo "✅ デプロイトリガー完了 ($(date '+%Y-%m-%d %H:%M:%S UTC'))"
